<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVERA shop 이미지 빌더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* NDS 토큰 — sirasolfa/design-system foundations (변수 실제값 기준) */
:root{
  --color-text-primary:#171c24; --color-text-secondary:#4b5465; --color-text-tertiary:#888e9c;
  --color-text-muted:#a6acb7; --color-text-disabled:#c5c9d3; --color-text-inverse:#fff; --color-text-brand:#4f7cff;
  --color-border-default:#edf0f5; --color-border-strong:#c5c9d3; --color-border-neutral:#e3e6ee; --color-border-focus:#c5c9d3; --color-border-disabled:#e3e6ee;
  --color-bg-default:#fff; --color-bg-subtle:#f9fafd; --color-bg-muted:#f4f6fb; --color-bg-disabled:#edf0f5; --color-bg-inverse:#2f3744; --color-bg-inverse-strong:#171c24;
  --color-bg-dim:#000000a3;
  --brand-default:#4f7cff; --brand-strongest:#1a318b; --icon-brand-bg:#eef3ff;
  --status-positive:#3fbe75; --status-negative:#e6374f; --status-warning:#ffc439;
  --rounded-xxs:4px; --rounded-xs:6px; --rounded-sm:8px; --rounded-md:12px; --rounded-lg:16px; --rounded-full:999px;
  --gap-4:4px; --gap-6:6px; --gap-8:8px; --gap-12:12px; --gap-16:16px; --gap-20:20px; --gap-24:24px; --gap-32:32px;
  --spacing-3xs:8px; --spacing-2xs:12px; --spacing-xs:16px; --spacing-md:20px; --spacing-lg:24px; --spacing-xl:28px; --spacing-2xl:32px;
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --panel-w:400px;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);color:var(--color-text-primary);background:var(--color-bg-default);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:60px 1fr;height:100vh}

/* Header */
.hd{display:flex;align-items:center;gap:var(--gap-32);padding:0 var(--spacing-lg);border-bottom:1px solid var(--color-border-default)}
.hd h1{display:flex;align-items:center;gap:var(--gap-8);font-size:17px;font-weight:700;white-space:nowrap}
.hd h1 .logo{display:block;height:20px;width:auto}
.hd h1 .div{width:1px;height:14px;background:var(--color-border-neutral)}
.slots{display:flex;gap:2px;background:var(--color-bg-muted);padding:3px;border-radius:var(--rounded-sm);overflow-x:auto}
.slots button{border:0;background:transparent;height:34px;padding:0 16px;border-radius:var(--rounded-xs);font-size:14px;font-weight:600;color:var(--color-text-tertiary);cursor:pointer;white-space:nowrap}
.slots button[aria-pressed=true]{background:#fff;color:var(--color-text-primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Body */
.bd{display:grid;grid-template-columns:var(--panel-w) 1fr;min-height:0}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--color-border-default);min-height:0;background:var(--color-bg-subtle)}
.tabs{display:flex;padding:0 var(--spacing-xs);border-bottom:1px solid var(--color-border-default);background:#fff}
.tabs button{flex:1;border:0;background:none;height:48px;font-size:15px;font-weight:600;color:var(--color-text-muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--color-text-primary);border-color:var(--color-text-primary)}
.scroll{flex:1;overflow:auto;padding:var(--spacing-xs);display:flex;flex-direction:column;gap:var(--gap-12)}
.card{background:#fff;border:1px solid var(--color-border-default);border-radius:var(--rounded-md);padding:var(--spacing-xs);display:flex;flex-direction:column;gap:var(--gap-12)}
.card h3{font-size:14px;font-weight:600;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.card h3 small{font-weight:400;color:var(--color-text-muted);font-size:12px}
.card h3 .grow{flex:1}
.seg{display:flex;background:var(--color-bg-muted);border-radius:var(--rounded-sm);padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;height:36px;border-radius:var(--rounded-xs);font-size:14px;font-weight:600;color:var(--color-text-tertiary);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--color-text-primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:var(--gap-8);flex-wrap:wrap}
.chip{border:1px solid var(--color-border-neutral);background:#fff;height:34px;padding:0 16px;border-radius:var(--rounded-full);font-size:14px;font-weight:600;color:var(--color-text-tertiary);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--brand-default);background:var(--icon-brand-bg);color:var(--brand-default)}
.row{display:flex;gap:var(--gap-8);align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--color-text-tertiary)}
.input,select.input,textarea.input{height:44px;border:1px solid var(--color-border-neutral);border-radius:var(--rounded-sm);padding:0 12px;font-size:14px;background:#fff;width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.4}
.input:focus{outline:2px solid var(--brand-default);outline-offset:-1px}
.counter{font-size:12px;color:var(--color-text-muted);text-align:right}
.counter.over{color:var(--status-negative);font-weight:600}
.btn{height:44px;border:0;border-radius:var(--rounded-sm);font-size:15px;font-weight:600;cursor:pointer;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{height:32px;font-size:13px;padding:0 12px}
.btn.primary{background:var(--brand-default);color:#fff}
.btn.secondary{background:var(--color-bg-inverse);color:#fff}
.btn.tertiary{background:var(--color-bg-muted);color:var(--color-text-secondary)}
.btn.outlined{background:#fff;border:1px solid var(--color-border-neutral);color:var(--color-text-secondary)}
.btn:disabled{opacity:.4;cursor:not-allowed}
a.btn{text-decoration:none}
.drop{border:1.5px dashed var(--color-border-strong);border-radius:var(--rounded-sm);padding:14px;text-align:center;font-size:13px;color:var(--color-text-tertiary);cursor:pointer;background:var(--color-bg-subtle)}
.drop.over{border-color:var(--brand-default);background:var(--icon-brand-bg)}
.thumb{position:relative;border-radius:var(--rounded-sm);overflow:hidden;background:var(--color-bg-muted);height:100px;display:flex;align-items:center;justify-content:center}
.thumb img{max-width:100%;max-height:100%}
.thumb .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.meta{font-size:12px;color:var(--color-text-muted)}
.adj{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.adj label{white-space:nowrap;display:flex;align-items:center;gap:4px;border:1px solid var(--color-border-neutral);border-radius:var(--rounded-sm);height:40px;padding:0 10px;font-size:12px;color:var(--color-text-muted);background:#fff}
.adj input{width:100%;border:0;text-align:right;font-weight:600;font-size:13px;color:var(--color-text-primary);min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-text-secondary);cursor:pointer}
/* NDS Checkbox — └ Checkbox-atomic type=box size=lg (Figma 358:1954) */
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:0;border:1px solid var(--color-border-neutral);border-radius:var(--rounded-xs);background:var(--color-bg-default) center/11.67px 7.92px no-repeat;cursor:pointer}
input[type=checkbox]:hover{border-color:var(--color-border-focus)}
input[type=checkbox]:checked{border-color:transparent;background-color:var(--color-bg-inverse-strong);background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2211.6662%22 height=%227.91633%22 viewBox=%220 0 11.6662 7.91633%22%3E%3Cpath d=%22M10.5557 0.187034C10.8065 -0.0590807 11.2169 -0.0628236 11.4722 0.178896C11.7274 0.420767 11.7313 0.816478 11.4806 1.06269L4.68623 7.72935C4.43679 7.97411 4.02897 7.97925 3.7731 7.74075L0.197405 4.40741C-0.0597879 4.16749 -0.0665148 3.77175 0.182215 3.52362C0.431017 3.27561 0.841408 3.26912 1.09871 3.50897L4.21194 6.41099L10.5557 0.187034Z%22 fill=%22white%22/%3E%3C/svg%3E")}
input[type=checkbox]:disabled{cursor:not-allowed;background-color:var(--color-bg-disabled);border-color:var(--color-border-disabled)}
input[type=checkbox]:disabled:checked{border-color:transparent;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2211.6662%22 height=%227.91633%22 viewBox=%220 0 11.6662 7.91633%22%3E%3Cpath d=%22M10.5557 0.187034C10.8065 -0.0590807 11.2169 -0.0628236 11.4722 0.178896C11.7274 0.420767 11.7313 0.816478 11.4806 1.06269L4.68623 7.72935C4.43679 7.97411 4.02897 7.97925 3.7731 7.74075L0.197405 4.40741C-0.0597879 4.16749 -0.0665148 3.77175 0.182215 3.52362C0.431017 3.27561 0.841408 3.26912 1.09871 3.50897L4.21194 6.41099L10.5557 0.187034Z%22 fill=%22%23C5C9D3%22/%3E%3C/svg%3E")}
input[type=checkbox]:focus-visible{outline:2px solid var(--brand-default);outline-offset:2px}
.note{font-size:12px;line-height:1.5;color:var(--color-text-tertiary);background:var(--color-bg-muted);border-radius:var(--rounded-sm);padding:8px 10px}
.note.warn{background:#fff7e0;color:#8a6300}
.footer{padding:var(--spacing-xs);border-top:1px solid var(--color-border-default);background:#fff;display:flex;flex-direction:column;gap:var(--gap-8)}
.footer .row .btn{flex:1}

/* Guide tab */
.guide h4{font-size:17px;font-weight:700}
.guide .ver{font-size:12px;color:var(--color-text-tertiary)}
.guide ul{padding-left:16px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5;color:var(--color-text-secondary)}
/* NDS Badge — type=soft, shape=rounded, size=md (Figma 407:1070) */
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:var(--rounded-xs);font-size:12px;line-height:1.5;letter-spacing:.12px;font-weight:600;background:var(--icon-brand-bg);color:var(--brand-default)}
.badge.gray{background:var(--color-bg-muted);color:var(--color-text-tertiary)}
.gsec p{font-size:13.5px;line-height:1.55;color:var(--color-text-secondary)}
.gsec h3{color:var(--color-text-primary)}
.gnum{font-size:12px;font-weight:600;color:var(--brand-default);font-variant-numeric:tabular-nums}
.gfig{display:block;width:100%;padding:0;border:1px solid var(--color-border-default);border-radius:var(--rounded-sm);background:var(--color-bg-subtle);overflow:hidden;cursor:zoom-in}
.gfig svg{display:block;width:100%;height:auto}
.gfig.big{cursor:default}
.guide a{color:var(--brand-default);font-size:13px;font-weight:600;text-decoration:none}

/* Stage */
.stage{background:var(--color-bg-muted);overflow:auto;position:relative;display:flex;flex-direction:column;min-width:0}
.toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--gap-16);padding:10px var(--spacing-lg);background:#fff;border-bottom:1px solid var(--color-border-default)}
.toolbar .hint{flex:1;min-width:0;font-size:13px;color:var(--color-text-tertiary)}
.toolbar .toggles{display:flex;align-items:center;gap:var(--gap-20)}
.toolbar .check small{color:var(--color-text-muted);font-size:12px}
.boards{flex:1;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start;align-content:flex-start;justify-content:center;padding:40px 32px 120px}
.board{display:flex;flex-direction:column;align-items:center;gap:10px}
.board .bl{font-size:14px;font-weight:600;color:var(--color-text-secondary)}
.board .bl small{font-weight:400;color:var(--color-text-tertiary)}
.board canvas{background:#fff;box-shadow:0 2px 12px rgba(23,28,36,.08);border-radius:2px;touch-action:none;cursor:grab}
.board canvas.active{outline:2px solid var(--brand-default);outline-offset:3px}
.board canvas.ro{cursor:default}
.board.dim canvas{opacity:.55}
.previews{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;width:100%}
.sec-title{width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:-24px}
.circles{display:flex;gap:24px;align-items:flex-end}
.circles div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--color-text-tertiary)}
.circles canvas{border-radius:50%;box-shadow:none;cursor:default}
.boards.is-empty{align-content:center;align-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--gap-20);text-align:center;color:var(--color-text-secondary);font-size:17px;font-weight:600;line-height:1.5}

/* Dialog */
dialog{margin:auto;border:0;border-radius:var(--rounded-lg);padding:0;width:min(760px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:var(--spacing-lg);display:flex;flex-direction:column;gap:var(--gap-16)}
.dlg h2{font-size:19px;font-weight:700}
.dlg p{font-size:14px;color:var(--color-text-tertiary)}
.cl{display:flex;flex-direction:column;gap:2px;border:1px solid var(--color-border-neutral);border-radius:var(--rounded-md);padding:8px;max-height:52vh;overflow:auto}
.cl .it{display:flex;gap:10px;align-items:flex-start;padding:8px;font-size:14px;line-height:1.4;color:var(--color-text-secondary)}
.cl .ic{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.cl .ok{background:var(--status-positive)} .cl .ng{background:var(--status-negative)} .cl .mn{background:var(--color-bg-muted);color:var(--color-text-tertiary)}
.cl .it small{display:block;color:var(--color-text-muted);font-size:12px}
.cl .grp{font-size:12px;font-weight:600;color:var(--color-text-muted);padding:8px 8px 2px}
.dlg .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--color-bg-inverse);color:#fff;padding:10px 16px;border-radius:var(--rounded-sm);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}

.mobile-block{display:none}
@media (max-width:1199px){ :root{--panel-w:320px} }
@media (max-width:767px){
  .app{display:none}
  .mobile-block{display:flex;height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px;line-height:1.6;color:var(--color-text-secondary)}
}
</style>
</head>

/* ========================= 상태 ========================= */
const S = {
  slot: 'collection', tab: 'edit',
  img: null, imgName: '', imgHasAlpha: false,
  tf: {},                    // board id → {x,y,s}
  targets: new Set(['MO','PC']),
  adj: {b:100, c:100, s:100},
  guides: true, system: true,
  ident: '', identManual: false,
  format: 'png',
  text: { label:'', title:'', badge:'', ctitle:'', headline:'', sub:'' },
  tpl: { mode:'current', light:false, key:'#1a1a1a', dim:'#000000' },
  bg: null
};
const P = () => PRESETS[S.slot];
const DEVICE = {MO:'모바일',PC:'데스크탑'};          // 화면 표기
const FILE_TAG = {MO:'mobile',PC:'desktop'}; // 파일명 표기
/* 텍스트 입력 전 플레이스홀더 — 입력칸과 미리보기에 같이 쓰고, 내보내기에는 넣지 않는다 */
const PH = {
  label:'서브타이틀 최대 한 줄이에요', title:'헤드라인 최대 두 줄이에요',
  badge:'배지 최대 한 줄이에요', ctitle:'타이틀 최대 두 줄이에요',
  headline:'헤드라인 최대 두 줄이에요', sub:'서브타이틀 최대 한 줄이에요'
};
function tv(key, exp){ const v=S.text[key]; return v ? {t:v, ph:false} : exp ? {t:'', ph:false} : {t:PH[key], ph:true}; }
function phAlpha(ctx){ ctx.globalAlpha = ctx.__baseAlpha; }
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='on') for(const [ev,fn] of Object.entries(v)) e.addEventListener(ev,fn); else if(k==='html') e.innerHTML=v; else if(v!==false&&v!=null) e.setAttribute(k,v===true?'':v);} for(const k of kids.flat()) if(k!=null) e.append(k.nodeType?k:document.createTextNode(k)); return e; };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ===================== 이미지 입력 ====================== */
function loadImage(src, name){
  return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>res(im); im.onerror=rej; im.src=src; im.dataset.name=name||''; });
}
async function setImage(src, name){
  try{
    const im = await loadImage(src, name);
    S.img = im; S.imgName = name || ''; S.imgHasAlpha = detectAlpha(im);
    if(!S.identManual) S.ident = slugify(name);
    S.tf = {}; fitAll(); renderPanel(); buildStage();
  }catch(e){ toast('이미지를 불러오지 못했어요 (URL은 CORS 허용 주소만 가능)'); }
}
function detectAlpha(im){
  const c=document.createElement('canvas'); const k=Math.min(1,200/Math.max(im.naturalWidth,im.naturalHeight));
  c.width=Math.max(1,Math.round(im.naturalWidth*k)); c.height=Math.max(1,Math.round(im.naturalHeight*k));
  const x=c.getContext('2d'); x.drawImage(im,0,0,c.width,c.height);
  try{ const d=x.getImageData(0,0,c.width,c.height).data; for(let i=3;i<d.length;i+=4) if(d[i]<250) return true; }catch(e){}
  return false;
}
function josa(w,a,b){ const c=w.charCodeAt(w.length-1); return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28 ? a : b; }
function slugify(n){ return (n||'').replace(/\.[a-z0-9]+$/i,'').trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,40); }
function handleFile(f){ if(!f) return; if(!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast('JPG · PNG · WebP만 올릴 수 있어요');
  const r=new FileReader(); r.onload=()=> setImage(r.result, f.name); r.readAsDataURL(f); }
$('#file').addEventListener('change', e=>{ handleFile(e.target.files[0]); e.target.value=''; });
document.addEventListener('paste', e=>{ const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if(it) handleFile(it.getAsFile()); });

/* ===================== 배치 계산 ====================== */
function frameOf(board){ // 이미지가 그려질 영역
  const p=P();
  if(p.area) return {...p.area};
  if(p.template) return {x:0,y:0,w:p.template.container,h:board.h};
  return {x:0,y:0,w:board.w,h:board.h};
}
function fitBoard(board, mode){
  const im=S.img; if(!im) return;
  const f=frameOf(board), iw=im.naturalWidth, ih=im.naturalHeight;
  mode = mode || P().fit || 'cover-center';
  let s = mode.startsWith('contain') ? Math.min(f.w/iw, f.h/ih) : Math.max(f.w/iw, f.h/ih);
  let x = f.x + (f.w-iw*s)/2, y = mode==='cover-top' ? f.y : f.y + (f.h-ih*s)/2;
  S.tf[board.id] = {x,y,s};
}
function fitAll(mode){ for(const b of P().boards) if(!mode || S.targets.has(b.id)) fitBoard(b, mode); }

/* ===================== 렌더링 ====================== */
function filterStr(){ const a=S.adj; return `brightness(${a.b}%) contrast(${a.c}%) saturate(${a.s}%)`; }
function wrap(ctx, text, maxW, maxLines){
  const out=[]; let overflow=false;
  for(const para of String(text).split('\n')){
    let line='';
    for(const ch of [...para]){
      if(ctx.measureText(line+ch).width > maxW && line){ out.push(line); line=ch.trimStart(); } else line+=ch;
    }
    out.push(line);
  }
  if(maxLines && out.length>maxLines){ overflow=true; out.length=maxLines; }
  return {lines:out, overflow};
}
function rrect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function drawImageLayer(ctx, board, clip){
  const t=S.tf[board.id]; if(!S.img||!t) return;
  ctx.save();
  if(clip){ ctx.beginPath(); ctx.rect(clip.x,clip.y,clip.w,clip.h); ctx.clip(); }
  ctx.filter=filterStr();
  ctx.drawImage(S.img, t.x, t.y, S.img.naturalWidth*t.s, S.img.naturalHeight*t.s);
  ctx.restore();
}

function renderBoard(ctx, board, opt){
  const p=P(), {w,h}=board;
  ctx.clearRect(0,0,w,h);
  if(p.template){ renderTemplate(ctx, board, opt); }
  else{
    ctx.fillStyle = p.bgFixed || S.bg || p.bg || '#fff'; ctx.fillRect(0,0,w,h);
    drawImageLayer(ctx, board, p.area || null);
  }
  if(opt.system && S.slot==='main') drawMainSystem(ctx, board);
  if(opt.guides) drawGuides(ctx, board);
}

/* 컬렉션·띠배너 3단 레이어 템플릿 */
function renderTemplate(ctx, board, opt){
  const p=P(), T=p.template, {w,h}=board, light=S.tpl.light;
  const base = light ? S.tpl.dim : '#000000';
  ctx.fillStyle=base; ctx.fillRect(0,0,w,h);
  drawImageLayer(ctx, board, {x:0,y:0,w:T.container,h});
  // ② 딤 — 이미지 쪽 투명 → 텍스트 쪽 불투명
  const g=ctx.createLinearGradient(0,0,w,0);
  g.addColorStop(0,hexA(base,0)); g.addColorStop(T.stops[0],hexA(base,0)); g.addColorStop(T.stops[1],hexA(base,1)); g.addColorStop(1,hexA(base,1));
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  // ③ 텍스트
  const showText = opt.export ? S.tpl.mode==='current' : true;
  if(!showText) return;
  ctx.save();
  if(!opt.export && S.tpl.mode==='guide') ctx.globalAlpha=.55;
  ctx.__baseAlpha=ctx.globalAlpha;
  const fg = light ? S.tpl.key : '#ffffff', ex=!!opt.export && !opt.preview;
  if(T.kind==='collection'){
    const x0=w-T.textW+T.pad.l, maxW=T.textW-T.pad.l-T.pad.r, bd=tv('badge',ex), ct=tv('ctitle',ex);
    ctx.font='600 8px '+fontFam(); const bw=ctx.measureText(bd.t).width+8, bh=bd.t?12:0;
    ctx.font='700 16px '+fontFam(); const tw=wrap(ctx,ct.t,maxW,2); const th=ct.t?tw.lines.length*16*1.3:0;
    const blockH=bh+(bh&&th?6:0)+th; let y=Math.max(T.pad.t-10,(h-blockH)/2);
    if(bd.t){
      phAlpha(ctx,bd.ph); ctx.fillStyle = light ? hexA(S.tpl.key,.3) : 'rgba(255,255,255,.4)'; rrect(ctx,x0,y,bw,bh,4); ctx.fill();
      ctx.fillStyle=fg; ctx.font='600 8px '+fontFam(); ctx.textBaseline='middle'; ctx.fillText(bd.t,x0+4,y+bh/2+.5); y+=bh+6;
    }
    if(ct.t){ phAlpha(ctx,ct.ph); ctx.fillStyle=fg; ctx.font='700 16px '+fontFam(); ctx.textBaseline='top'; tw.lines.forEach((l,i)=>ctx.fillText(l,x0,y+i*16*1.3+1.6)); }
  }else{
    const x0=w-T.textW+T.pad.l, maxW=T.textW-T.pad.l-T.pad.r, hd=tv('headline',ex), sbt=tv('sub',ex);
    ctx.font='600 12px '+fontFam(); const hl=wrap(ctx,hd.t,maxW,2);
    ctx.font='400 9px '+fontFam(); const sb=wrap(ctx,sbt.t,maxW,1);
    const hh=hd.t?hl.lines.length*12*1.1:0, blockH=hh+(hh&&sbt.t?4:0)+(sbt.t?9*1.5:0); let y=(h-blockH)/2;
    ctx.textBaseline='top';
    if(hd.t){ phAlpha(ctx,hd.ph); ctx.fillStyle=fg; ctx.font='600 12px '+fontFam(); hl.lines.forEach((l,i)=>ctx.fillText(l,x0,y+i*12*1.1)); y+=hh+4; }
    if(sbt.t){ phAlpha(ctx,sbt.ph); ctx.font='400 9px '+fontFam(); ctx.fillStyle= light ? hexA(S.tpl.key,.64) : 'rgba(255,255,255,.64)'; ctx.fillText(sb.lines[0],x0,y+1); }
  }
  ctx.restore();
}

/* 메인 배너 — 시스템이 덧씌우는 딤·텍스트·페이지네이션 (미리보기 전용, 내보내기 제외) */
function drawMainSystem(ctx, board){
  const {w,h}=board, A=P().textArea[board.id];
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,'rgba(0,0,0,.16)'); g.addColorStop(1,'rgba(0,0,0,.64)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  const maxW=w-A.l-A.r;
  const lb=tv('label'), ti=tv('title'); ctx.__baseAlpha=1;
  ctx.font='700 20px '+fontFam(); const tt=wrap(ctx,ti.t,maxW,2);
  const titleH=tt.lines.length*20*1.3, labelH=12*1.5;
  let y=h-A.b-titleH-labelH-6;
  ctx.textBaseline='top';
  phAlpha(ctx,lb.ph); ctx.font='600 12px '+fontFam(); ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(lb.t,A.l,y+3); y+=labelH+6;
  phAlpha(ctx,ti.ph); ctx.font='700 20px '+fontFam(); ctx.fillStyle='#fff'; tt.lines.forEach((l,i)=>ctx.fillText(l,A.l,y+i*26+3));
  phAlpha(ctx,false);
  ctx.font='600 11px '+fontFam(); ctx.textAlign='right'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillText('/ 03', w-A.pag.r, h-A.pag.b);
  const sw=ctx.measureText(' / 03').width; ctx.fillStyle='#fff'; ctx.fillText('01', w-A.pag.r-sw, h-A.pag.b);
  ctx.textAlign='left';
}

function drawGuides(ctx, board){
  const p=P(), {w,h}=board;
  ctx.save(); ctx.lineWidth=1; ctx.font='600 10px '+fontFam(); ctx.textBaseline='top';
  if(S.slot==='main'){
    const sh=Math.round(h*2/3);
    ctx.fillStyle='rgba(16,185,129,.10)'; ctx.fillRect(0,0,w,sh);
    ctx.strokeStyle='rgba(16,185,129,.9)'; ctx.setLineDash([4,3]); ctx.strokeRect(.5,.5,w-1,sh-1);
    ctx.fillStyle='rgba(239,68,68,.10)'; ctx.fillRect(0,sh,w,h-sh);
    ctx.setLineDash([]); label(ctx,'이미지 세이프 영역 (상단 2/3)',6,6,'#10b981'); label(ctx,'딤 + 텍스트 영역',6,sh+6,'#ef4444');
    vline(ctx, w/2, h); hline(ctx, h/2, w);
  }else if(S.slot==='collection'){
    const c=p.crop; ctx.fillStyle='rgba(255,0,200,.22)';
    ctx.fillRect(0,0,w,c); ctx.fillRect(0,h-c,w,c); ctx.fillRect(0,c,c,h-2*c); ctx.fillRect(w-c,c,c,h-2*c);
    ctx.strokeStyle='#2ead66'; ctx.setLineDash([4,3]); ctx.strokeRect(c+.5,c+.5,w-2*c-1,h-2*c-1);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.strokeRect(.5,.5,p.template.container-1,h-1);
    ctx.setLineDash([]); label(ctx,'이미지 컨테이너 180×140',4,c+4,'#4f7cff'); label(ctx,'세이프 335×100',w-c-92,h-c-18,'#2ead66');
    const k=27*140/194.13; ctx.strokeStyle='rgba(255,177,51,.9)'; ctx.setLineDash([2,2]); hline(ctx,k,w,true); hline(ctx,h-k,w,true);
  }else if(S.slot==='strip'){
    const c=p.safe; ctx.fillStyle='rgba(255,0,200,.22)';
    ctx.fillRect(0,0,w,c); ctx.fillRect(0,h-c,w,c); ctx.fillRect(0,c,c,h-2*c); ctx.fillRect(w-c,c,c,h-2*c);
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.setLineDash([4,3]); ctx.strokeRect(.5,.5,p.template.container-1,h-1);
  }else if(S.slot==='product'){
    const a=p.area; ctx.strokeStyle='#4f7cff'; ctx.setLineDash([5,4]); ctx.strokeRect(a.x+.5,a.y+.5,a.w-1,a.h-1);
    ctx.setLineDash([]); ctx.fillStyle='rgba(79,124,255,.06)';
    ctx.fillRect(0,0,w,a.y); ctx.fillRect(0,a.y+a.h,w,h-a.y-a.h); ctx.fillRect(0,a.y,a.x,a.h); ctx.fillRect(a.x+a.w,a.y,w-a.x-a.w,a.h);
    label(ctx,'이미지 영역 320×320',a.x+4,a.y+4,'#4f7cff'); label(ctx,'여백 90',w/2-20,a.y/2-7,'#888e9c');
    vline(ctx,w/2,h); hline(ctx,h/2,w);
  }else if(S.slot==='artist'){
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.rect(0,0,w,h); ctx.arc(w/2,h/2,w/2,0,Math.PI*2,true); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.arc(w/2,h/2,w/2-.5,0,Math.PI*2); ctx.stroke();
    vline(ctx,w/2,h); hline(ctx,h/2,w);
  }
  ctx.restore();
}
function label(ctx,t,x,y,c){ const tw=ctx.measureText(t).width+8; ctx.fillStyle='rgba(255,255,255,.88)'; rrect(ctx,x,y,tw,14,3); ctx.fill(); ctx.fillStyle=c; ctx.fillText(t,x+4,y+2); }
function vline(ctx,x,h){ ctx.save(); ctx.strokeStyle='rgba(79,124,255,.45)'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,h); ctx.stroke(); ctx.restore(); }
function hline(ctx,y,w,keep){ ctx.save(); if(!keep){ctx.strokeStyle='rgba(79,124,255,.45)'; ctx.setLineDash([3,3]);} ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(w,y+.5); ctx.stroke(); ctx.restore(); }
function fontFam(){ return "'Pretendard Variable', Pretendard, sans-serif"; }

/* 내보내기용 렌더 (@scale, 가이드·시스템 레이어 제외) */
function renderExport(board, preview){
  const p=P(), c=document.createElement('canvas'); c.width=Math.round(board.w*p.scale); c.height=Math.round(board.h*p.scale);
  const ctx=c.getContext('2d'); ctx.scale(p.scale,p.scale); ctx.imageSmoothingQuality='high';
  renderBoard(ctx, board, {export:true, preview:!!preview}); return c;   // preview: 노출 미리보기용(입력 전 플레이스홀더 포함)
}

/* ===================== 스테이지 ====================== */
const canvases = {};
function buildStage(){
  const p=P(), wrapEl=$('#boards'); wrapEl.innerHTML=''; $('#hint').textContent=p.hint;
  for(const k in canvases) delete canvases[k];
  wrapEl.classList.toggle('is-empty', !S.img);
  if(!S.img){
    wrapEl.append(el('div',{class:'empty'}, el('div',{},`${p.name}${josa(p.name,'을','를')} 만들 이미지를 올려주세요`),
      el('button',{class:'btn primary',on:{click:()=>$('#file').click()}},'이미지 선택')));
    wrapEl.ondragover=e=>{e.preventDefault()}; wrapEl.ondrop=e=>{e.preventDefault(); handleFile(e.dataTransfer.files[0]);};
    return;
  }
  for(const b of p.boards){
    const cv=el('canvas',{width:Math.round(b.w*2),height:Math.round(b.h*2),style:`width:${b.w}px;height:${b.h}px`});
    cv.dataset.id=b.id; attachDrag(cv,b); canvases[b.id]=cv;
    const out=`${b.w*p.scale}×${b.h*p.scale}`;
    const lab = p.boards.length>1 ? `${DEVICE[b.id]} (${b.w}×${b.h})` : `${p.name} (${b.w}×${b.h})`;
    wrapEl.append(el('div',{class:'board'+(p.boards.length>1&&!S.targets.has(b.id)?' dim':'')}, el('div',{class:'bl'}, lab, el('small',{},` → 출력 ${out}`)), cv));
  }
  if(p.previews){
    wrapEl.append(el('div',{class:'sec-title'},'실제 노출 미리보기 (내보낼 이미지 기준)'));
    const pv=el('div',{class:'previews'});
    p.previews.forEach((v,i)=>{ const cv=el('canvas',{class:'ro',width:Math.round(v.w*2),height:Math.round(v.h*2),style:`width:${v.w}px;height:${v.h}px`}); canvases['pv'+i]={cv,v}; pv.append(el('div',{class:'board'},el('div',{class:'bl'},v.label),cv)); });
    wrapEl.append(pv);
  }
  if(p.circle){
    const cs=el('div',{class:'circles'});
    for(const d of [52,40]){ const cv=el('canvas',{class:'ro',width:d*3,height:d*3,style:`width:${d}px;height:${d}px`}); canvases['c'+d]={cv,d}; cs.append(el('div',{},cv,`${d===52?'데스크탑':'모바일'} ${d}px`)); }
    wrapEl.append(el('div',{class:'board'},el('div',{class:'bl'},'원형 노출 미리보기'),cs));
  }
  wrapEl.ondragover=e=>{e.preventDefault()}; wrapEl.ondrop=e=>{e.preventDefault(); handleFile(e.dataTransfer.files[0]);};
  draw();
}
function draw(){
  const p=P(); if(!S.img) return;
  for(const b of p.boards){
    const cv=canvases[b.id]; if(!cv) continue; const ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0); renderBoard(ctx,b,{guides:S.guides, system:S.system});
    cv.classList.toggle('active', p.boards.length>1 && S.targets.has(b.id));
  }
  if(p.previews){
    const src=renderExport(p.boards[0], true);
    p.previews.forEach((v,i)=>{ const {cv}=canvases['pv'+i]; const ctx=cv.getContext('2d'); ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,v.w,v.h);
      const s=Math.max(v.w/src.width, v.h/src.height), dw=src.width*s, dh=src.height*s; ctx.drawImage(src,(v.w-dw)/2,(v.h-dh)/2,dw,dh); });
  }
  if(p.circle){
    const src=renderExport(p.boards[0], true);
    for(const d of [52,40]){ const {cv}=canvases['c'+d]; const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); ctx.drawImage(src,0,0,cv.width,cv.height); }
  }
}
function attachDrag(cv, board){
  let last=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*board.w/r.width, y:(e.clientY-r.top)*board.h/r.height}; };
  const affected=()=> P().boards.length>1 ? [...S.targets] : [board.id];
  cv.addEventListener('pointerdown',e=>{ if(P().boards.length>1 && !S.targets.has(board.id)){ S.targets=new Set([board.id]); renderPanel(); buildStage(); return; } cv.setPointerCapture(e.pointerId); last=pt(e); cv.style.cursor='grabbing'; });
  cv.addEventListener('pointermove',e=>{ if(!last) return; const q=pt(e), dx=q.x-last.x, dy=q.y-last.y; last=q; for(const id of affected()){ const t=S.tf[id]; if(t){t.x+=dx; t.y+=dy;} } draw(); });
  const end=()=>{ last=null; cv.style.cursor=''; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const q=pt(e), k=Math.exp(-e.deltaY*0.0015);
    for(const id of affected()){ const t=S.tf[id]; if(!t) continue; const b=P().boards.find(x=>x.id===id); const ax=q.x*b.w/board.w, ay=q.y*b.h/board.h; t.x=ax-(ax-t.x)*k; t.y=ay-(ay-t.y)*k; t.s*=k; }
    draw(); },{passive:false});
}

/* ===================== 패널 ====================== */
function renderSlots(){
  const nav=$('#slots'); nav.innerHTML='';
  for(const [k,v] of Object.entries(PRESETS)) if(!v.hidden) nav.append(el('button',{'aria-pressed':String(S.slot===k),on:{click:()=>switchSlot(k)}},v.name));
}
function switchSlot(k){
  S.slot=k; const p=P();
  if(p.boards) S.targets=new Set(p.boards.map(b=>b.id));
  S.format=p.formats[0]; S.tf={}; if(S.img) fitAll();
  renderSlots(); renderPanel(); buildStage();
}
function card(title, ...kids){ return el('div',{class:'card'}, el('h3',{}, ...[].concat(title)), ...kids); }
function seg(opts, val, onPick){ return el('div',{class:'seg'}, opts.map(([v,l])=>el('button',{'aria-pressed':String(val===v),on:{click:()=>{onPick(v);}}},l))); }
function textField(lbl, key, opts={}){
  const isArea=opts.area; const inp=el(isArea?'textarea':'input',{class:'input',rows:isArea?2:false,value:isArea?false:S.text[key],placeholder:PH[key]});
  if(isArea) inp.value=S.text[key];
  const cnt=el('div',{class:'counter'});
  const upd=()=>{ if(opts.counter){ const r=opts.counter(S.text[key]); cnt.textContent=r.text; cnt.classList.toggle('over',!r.ok);} };
  inp.addEventListener('input',()=>{ S.text[key]=inp.value; upd(); draw(); }); upd();
  return el('div',{class:'field'}, el('label',{},lbl), inp, opts.counter?cnt:null);
}
function mainLabelCounter(v){ const n=[...v].length, nl=v.includes('\n'); return {ok:n<=20&&!nl, text:`${n}/20자 · 1줄${nl?' (줄바꿈 불가)':''}`}; }
function mainTitleCounter(v){ const r=titleLines(v); const tot=r.reduce((a,l)=>a+[...l].length,0); const ok=r.length<=2&&r.every(l=>[...l].length<=15)&&tot<=30; return {ok, text:`${r.length}/2줄 · 줄당 ${r.map(l=>[...l].length).join('·')}/15자 · 총 ${tot}/30자`}; }
function titleLines(v){ const c=document.createElement('canvas').getContext('2d'); c.font='700 20px '+fontFam(); const w=375-28-72; return wrap(c,v,w).lines; }

  const url=el('input',{class:'input',placeholder:'이미지 URL 붙여넣기 후 Enter'}); url.addEventListener('keydown',e=>{ if(e.key==='Enter'&&url.value) setImage(url.value.trim(), url.value.split('/').pop()); });

  if(S.img){

      el('div',{class:'meta'}, `${S.imgName||'이미지'} · ${iw}×${ih}${S.imgHasAlpha?' · 투명 배경':''}`));

      el('button',{class:'btn sm outlined',on:{click:()=>{fitAll(p.area?'contain-area':(p.fit==='cover-top'?'cover-top':'cover-center'));draw();}}},'맞춤'),

      el('button',{class:'btn sm outlined',on:{click:()=>{ for(const id of (p.boards.length>1?S.targets:[p.boards[0].id])){ const t=S.tf[id]; if(!t) continue; const b=p.boards.find(x=>x.id===id), f=frameOf(b); t.x=f.x+(f.w-S.img.naturalWidth*t.s)/2; t.y=f.y+(f.h-S.img.naturalHeight*t.s)/2; } draw(); }}},'중앙 정렬')));
  }

  // 보정
  const adjCard=card(['이미지 보정', el('span',{class:'grow'}), el('button',{class:'btn sm tertiary',on:{click:()=>{S.adj={b:100,c:100,s:100};renderPanel();draw();}}},'초기화')]);

    else { const c=el('input',{type:'color',value:S.bg||p.bg}); c.addEventListener('input',()=>{S.bg=c.value;draw();}); ed.append(card(['배경색',el('small',{},'이미지가 비는 영역')], el('div',{class:'row'},c,el('span',{class:'meta'},'이미지가 화면을 다 덮으면 보이지 않아요')))); }

      textField('헤드라인 (headline)','title',{area:true,counter:mainTitleCounter}),
      el('div',{class:'note'},'어드민의 subTitle · headline 칸에 입력하는 값이에요. 쇼핑몰이 이미지 위에 직접 그려요.')));
  }
  if(p.template){
    const T=p.template;
    const modeCard=card('텍스트 렌더링 모드', seg([['current','현행 운영 (텍스트 합성)'],['guide','가이드 준수 (텍스트 제외)']],S.tpl.mode,v=>{S.tpl.mode=v;renderPanel();draw();}),

    const lightChk=el('input',{type:'checkbox'}); lightChk.checked=S.tpl.light; lightChk.addEventListener('change',()=>{S.tpl.light=lightChk.checked; if(S.tpl.light&&S.tpl.dim==='#000000') S.tpl.dim='#f3eadb'; renderPanel();draw();});

    }

function renderToggles(){

function renderContrast(){
  const box=$('#contrast'); if(!box) return; const r=contrastChecks();
  box.innerHTML=r.map(c=>`${c.ok?'✅':'⚠️'} ${c.name} 대비 ${c.ratio.toFixed(2)}:1 ${c.ok?'(AA 통과)':'(AA 4.5:1 미달)'}`).join('<br>');
  box.className='note'+(r.every(c=>c.ok)?'':' warn');
}

  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${base}"/>
  <rect x="${x}" y="${y}" width="${180*k}" height="${h}" fill="${dark?'#9aa3b5':'#e8dcc6'}"/><circle cx="${x+90*k}" cy="${y+62*k}" r="${26*k}" fill="${dark?'#c5c9d3':'#d6c3a5'}"/><rect x="${x+56*k}" y="${y+92*k}" width="${68*k}" height="${30*k}" rx="${8*k}" fill="${dark?'#c5c9d3':'#d6c3a5'}"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${id})"/>
  <rect x="${x+(375-195+6)*k}" y="${y+40*k}" width="${66*k}" height="${12*k}" rx="${4*k}" fill="${dark?'rgba(255,255,255,.4)':'rgba(91,70,48,.3)'}"/>
  ${T(x+(375-195+10)*k, y+49*k, badge, {s:8*k, w:600, c:fg})}

}

function lum(hex){ const n=parseInt(hex.slice(1),16); return [n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0); }
function ratio(a,b){ const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); }
function blend(fg,a,bg){ const f=parseInt(fg.slice(1),16),b=parseInt(bg.slice(1),16); const m=s=>Math.round(((f>>s)&255)*a+((b>>s)&255)*(1-a)); return '#'+[16,8,0].map(s=>m(s).toString(16).padStart(2,'0')).join(''); }
function contrastChecks(){
  const T=P().template; if(!T) return [];
  const base=S.tpl.light?S.tpl.dim:'#000000', fg=S.tpl.light?S.tpl.key:'#ffffff', out=[];
  if(T.kind==='collection'){
    out.push({name:'타이틀', ratio:ratio(fg,base)});
    const badgeBg=S.tpl.light?blend(S.tpl.key,.3,base):blend('#ffffff',.4,base); out.push({name:'배지', ratio:ratio(fg,badgeBg)});
  }else{
    out.push({name:'헤드라인', ratio:ratio(fg,base)});
    out.push({name:'서브타이틀', ratio:ratio(blend(fg,.64,base),base)});
  }
  return out.map(c=>({...c, ok:c.ratio>=4.5}));
}
function autoChecks(boards){

    out.push({ok:true, t:`${tag}출력 크기 ${b.w*p.scale}×${b.h*p.scale}`, d:'기준 사이즈와 일치'});
    if(!t) continue;

    out.push({ok:up<=1.05, t:`${tag}원본 해상도`, d: up<=1.05?'출력 대비 충분해요':`원본을 ${up.toFixed(2)}배 확대해 흐릴 수 있어요 (2x 이상 원본 권장)`});
    if(p.area){

      out.push({ok:inside, t:'상품이 320×320 영역 안에 모두 들어감', d:inside?'':'영역 밖으로 넘친 부분은 잘려요'});

      out.push({ok:S.imgHasAlpha, t:'누끼(투명 배경) 이미지', d:S.imgHasAlpha?'':'배경이 있는 이미지예요'});

    }else{
      const cover=t.x<=f.x+.5&&t.y<=f.y+.5&&t.x+iw>=f.x+f.w-.5&&t.y+ih>=f.y+f.h-.5;

    out.push({ok:l.ok, t:'서브타이틀 1줄 · 20자 이내', d:l.text}); out.push({ok:ti.ok, t:'헤드라인 2줄 · 줄당 15자 · 총 30자 이내', d:ti.text});
  }

    const c=document.createElement('canvas').getContext('2d'), T=p.template, maxW=T.textW-T.pad.l-T.pad.r;
    if(T.kind==='collection'){ c.font='700 16px '+fontFam(); const r=wrap(c,S.text.ctitle,maxW,2); out.push({ok:!r.overflow, t:'타이틀 2줄 이내', d:r.overflow?'2줄을 넘어 잘려요':''}); }
    else{ c.font='600 12px '+fontFam(); const r=wrap(c,S.text.headline,maxW,2); c.font='400 9px '+fontFam(); const s=wrap(c,S.text.sub,maxW,1);
      out.push({ok:!r.overflow, t:'헤드라인 최대 2줄', d:r.overflow?'2줄을 넘어 잘려요':''}); out.push({ok:!s.overflow, t:'서브타이틀 1줄', d:s.overflow?'1줄을 넘어 잘려요':''}); }
    if(S.tpl.mode==='current'){ const need=T.kind==='collection'?['ctitle']:['headline']; const miss=need.filter(k=>!S.text[k]);

  }
  return out;
}

function yymmdd(){ const d=new Date(); return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function fileName(b, fmt){

}
function toBlob(c, fmt, q){ return new Promise(r=>c.toBlob(r, fmt==='jpg'?'image/jpeg':fmt==='webp'?'image/webp':'image/png', q)); }
async function encode(c, fmt, limitMB){

  if(fmt==='png' && blob.size>limitMB*1048576 && P().formats.includes('jpg')) return {blob, over:true};
  while(fmt!=='png' && blob.size>limitMB*1048576 && q>.5){ q-=.1; blob=await toBlob(c,fmt,q); }

  for(const b of boards){
    const c=renderExport(b), r=await encode(c, S.format, p.limitMB);
    if(r.over){ toast(`${fileName(b,S.format)} 용량이 ${p.limitMB}MB를 넘어요${S.format==='png'?' — JPG로 바꿔 보세요':''}`); return; }
    files.push({name:fileName(b,S.format), blob:r.blob});
  }
  if(files.length===1) download(files[0].blob, files[0].name);
  else{ const z=new JSZip(); files.forEach(f=>z.file(f.name,f.blob)); download(await z.generateAsync({type:'blob'}), `${p.key}_${S.ident||'untitled'}_${yymmdd()}.zip`); }
  openDone(files.map(f=>({name:f.name,size:f.blob.size})));
}
function openDone(files){
  const a=adminPage(), dlg=$('#dlg'), body=$('#dlgBody'); body.innerHTML='';
  body.append(el('h2',{},'다운로드했어요'),
    el('div',{class:'cl'}, el('div',{class:'grp'},'내려받은 파일'), files.map(f=>el('div',{class:'it'}, el('span',{class:'ic ok'},'✓'), el('div',{}, f.name, el('small',{},`${(f.size/1024).toFixed(0)}KB`)))),
      el('div',{class:'grp'},`어드민 ${a.menu}에서 직접 올려 주세요`), a.steps.map((t,i)=>el('div',{class:'it'}, el('span',{class:'ic mn'},String(i+1)), el('div',{},t)))),
    el('div',{class:'note'},'보안을 위해 이 툴은 어드민에 접속하거나 로그인 정보를 다루지 않아요. 링크로 등록 화면만 열어요.'),
    el('div',{class:'row'}, el('button',{class:'btn tertiary',on:{click:()=>dlg.close()}},'닫기'), adminLink('btn primary')));
  dlg.showModal();
}
function download(blob,name){ const a=el('a',{href:URL.createObjectURL(blob),download:name}); document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }

/* ===================== 시작 ====================== */
(async function init(){
  try{ await Promise.all(['400','600','700'].map(w=>document.fonts.load(`${w} 16px 'Pretendard Variable'`))); }catch(e){}
  renderSlots(); renderPanel(); buildStage();
  window.__S=S; window.__setImage=setImage; window.__autoChecks=()=>autoChecks(P().boards); window.__renderExport=()=>P().boards.map(b=>{const c=renderExport(b);return [c.width,c.height];});
})();
</script>
